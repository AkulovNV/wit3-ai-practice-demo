# Единая точка входа ко всем моделям. Клиенты знают только алиасы (local-coder, local-general, cloud),
# а не провайдера: смена модели = правка этого файла, клиенты не меняются.
model_list:
  - model_name: local-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192   # окно контекста; по умолчанию у Ollama меньше, и описания MCP-тулов не влезают
    model_info:
      # условная цена: локальная модель бесплатна, но так на стенде работают бюджеты и учёт стоимости
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  # general-модель для агентов: у qwen2.5 нативный tool calling (coder-версия пишет вызовы тулов текстом)
  - model_name: local-general
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192   # окно контекста; по умолчанию у Ollama меньше, и описания MCP-тулов не влезают
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  # эмбеддинги для RAG (Open WebUI, занятие 2)
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL
  # опционально: облачная модель через тот же gateway (нужен ANTHROPIC_API_KEY в .env)
  - model_name: cloud
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
